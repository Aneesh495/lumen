name: Lumen CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Verify Zero-Dash, C API, and Python SDK
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Typography Hygiene (Zero Em/En Dashes)
        run: |
          python3 scripts/verify_no_dashes.py

      - name: Build and Test C API Shared Library
        run: |
          make -C c_api clean
          make -C c_api test

      - name: Test Python Client SDK
        run: |
          PYTHONPATH=python python3 -m unittest discover -s python/tests
